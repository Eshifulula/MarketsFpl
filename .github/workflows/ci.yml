name: CI

# Public repo => standard GitHub-hosted runners are free. Nothing here uses secrets:
# no VPS details, no FPL credentials, no deploy. (Deployment is intentionally NOT in this repo yet.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint
        run: uv run python -m ruff check .
      - name: Tests (no network, no browser, no credentials)
        run: uv run python -m pytest -q

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker image builds (not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --pull -t markets-fpl:ci .
      - name: Image runs as a non-root user
        run: |
          # Capture on its own line: a failing `docker run` must stop the step (bash -e), not
          # leave an empty string that would pass a "!= 0" comparison.
          uid="$(docker run --rm --entrypoint id markets-fpl:ci -u)"
          case "$uid" in
            ''|*[!0-9]*) echo "could not read a numeric uid (got '$uid')"; exit 1 ;;
          esac
          test "$uid" -ne 0
      - name: Image refuses an unsafe config (HTTP transport without a bearer token)
        run: |
          code=0
          out="$(docker run --rm -e FPL_MCP_TRANSPORT=streamable-http markets-fpl:ci 2>&1)" || code=$?
          echo "$out"
          test "$code" -eq 2
          echo "$out" | grep -q "Refusing to start"
