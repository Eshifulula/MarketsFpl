[project]
name = "markets-fpl"
version = "0.2.0"
description = "Approval-gated Fantasy Premier League MCP server (hardened fork of lewis-king/fpl-mcp-server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "playwright>=1.44",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
]

[project.scripts]
markets-fpl = "fpl_server.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Upstream modules (mcp_tools/mcp_resources/mcp_prompts/...) are carried over largely as-is.
# New, security-critical modules are held to the full rule set below.
extend-exclude = ["uv.lock"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Carried-over upstream code: keep correctness checks, skip stylistic/security-lint noise.
"src/fpl_server/mcp_tools.py" = ["E", "W", "I", "B", "S"]
"src/fpl_server/mcp_resources.py" = ["E", "W", "I", "B", "S"]
"src/fpl_server/mcp_prompts.py" = ["E", "W", "I", "B", "S"]
"src/fpl_server/models.py" = ["E", "W", "I", "B", "S"]
"src/fpl_server/state.py" = ["E", "W", "I", "B", "S"]
"src/fpl_server/rotowire_scraper.py" = ["E", "W", "I", "B", "S"]
"src/fpl_server/client.py" = ["E", "W", "I", "B", "S"]
# Selector-probing loops intentionally swallow Playwright timeouts and try the next selector.
"src/fpl_server/auth.py" = ["S110", "S112"]
